<title>Alignment Bestiary · Wiki</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ======================== TOKENS / THEMES ======================== */
:root{
  --ground:#12141c; --ground2:#0d0f16; --panel:#171a24; --panel2:#1c2030;
  --ink:#e9e3d3; --ink-soft:#b9b3a2; --ink-faint:#867f6f;
  --rule:#2a2e3c; --rule-soft:#232734;
  --gold:#d9a441; --gold-soft:#b7883a; --gold-deep:#8a6a2e;
  --vellum:#e9e3d3;
  --shadow:0 18px 50px rgba(0,0,0,.5);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --ui:'Onest',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; /* CHANGED 2026-11-09: the site's text face */
}
@media (prefers-color-scheme: light){
  :root{
    --ground:#f3ecdb; --ground2:#ece3cd; --panel:#f7f1e2; --panel2:#efe6d0;
    --ink:#302716; --ink-soft:#5f5540; --ink-faint:#8a7f66;
    --rule:#d8ccac; --rule-soft:#e3d9be;
    --gold:#9a6f1f; --gold-soft:#b0842a; --gold-deep:#7a561a;
    --vellum:#453a22;
    --shadow:0 14px 40px rgba(80,64,26,.18);
  }
}
:root[data-theme="dark"]{
  --ground:#12141c; --ground2:#0d0f16; --panel:#171a24; --panel2:#1c2030;
  --ink:#e9e3d3; --ink-soft:#b9b3a2; --ink-faint:#867f6f;
  --rule:#2a2e3c; --rule-soft:#232734;
  --gold:#d9a441; --gold-soft:#b7883a; --gold-deep:#8a6a2e; --vellum:#e9e3d3;
  --shadow:0 18px 50px rgba(0,0,0,.5);
}
:root[data-theme="light"]{
  --ground:#f3ecdb; --ground2:#ece3cd; --panel:#f7f1e2; --panel2:#efe6d0;
  --ink:#302716; --ink-soft:#5f5540; --ink-faint:#8a7f66;
  --rule:#d8ccac; --rule-soft:#e3d9be;
  --gold:#9a6f1f; --gold-soft:#b0842a; --gold-deep:#7a561a; --vellum:#453a22;
  --shadow:0 14px 40px rgba(80,64,26,.18);
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, color-mix(in srgb,var(--gold) 7%, transparent), transparent 60%),
    radial-gradient(900px 700px at -10% 110%, color-mix(in srgb,var(--gold) 5%, transparent), transparent 55%),
    linear-gradient(180deg,var(--ground),var(--ground2));
  background-attachment:fixed;
  color:var(--ink); font-family:var(--serif);
  font-size:17px; line-height:1.66; -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
::selection{background:color-mix(in srgb,var(--gold) 34%, transparent)}

/* ======================== LAYOUT ======================== */
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:0;min-height:100vh}
.side{
  position:sticky;top:0;align-self:start;height:100vh;overflow:auto;
  border-right:1px solid var(--rule); background:linear-gradient(180deg,var(--panel),var(--panel2));
  padding:22px 20px 40px; display:flex;flex-direction:column;gap:18px;
}
.main{min-width:0;padding:0}
.pad{padding:46px clamp(22px,5vw,72px) 120px;max-width:1140px;margin:0 auto}

/* ---- sidebar ---- */
.brand{display:flex;flex-direction:column;gap:2px;cursor:pointer}
.brand .mark{font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-family:var(--ui)}
.brand h1{margin:2px 0 0;font-size:23px;font-weight:600;letter-spacing:.01em;line-height:1.1}
.brand .sub{font-size:12.5px;color:var(--ink-faint);font-family:var(--ui);letter-spacing:.02em}

.search{position:relative}
.search input{
  width:100%;padding:10px 12px 10px 34px;border-radius:9px;
  border:1px solid var(--rule);background:var(--ground2);color:var(--ink);
  font-family:var(--ui);font-size:14px;outline:none;
}
.search input:focus{border-color:var(--gold-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 18%,transparent)}
.search .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5;font-size:14px}

.navsec{display:flex;flex-direction:column;gap:7px}
.navsec .cap{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint);font-family:var(--ui)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-family:var(--ui);font-size:12px;line-height:1;padding:6px 9px;border-radius:20px;
  border:1px solid var(--rule);color:var(--ink-soft);cursor:pointer;display:inline-flex;gap:6px;align-items:center;
  transition:border-color .15s,color .15s,background .15s;
}
.chip:hover{color:var(--ink);border-color:var(--gold-soft)}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.chip.active{background:color-mix(in srgb,var(--gold) 14%,transparent);border-color:var(--gold-soft);color:var(--ink)}

.topctl{display:flex;gap:8px;align-items:stretch}
.topctl .langtog{flex:1}
.themebtn{
  font-family:var(--ui);font-size:15px;color:var(--ink-soft);line-height:1;
  border:1px solid var(--rule);background:transparent;border-radius:9px;padding:0 13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;min-width:44px;
}
.themebtn:hover{border-color:var(--gold-soft);color:var(--ink)}

/* ======================== HOME / CATALOGUE ======================== */
.title-page{text-align:center;padding:30px 0 14px}
.title-page .orn{color:var(--gold);letter-spacing:.4em;font-size:13px;font-family:var(--ui)}
.title-page h2{font-size:clamp(34px,6vw,58px);font-weight:600;margin:16px 0 6px;text-wrap:balance;line-height:1.04}
.title-page .latin{font-style:italic;color:var(--ink-soft);font-size:19px;margin-bottom:20px}
.title-page .lede{max-width:60ch;margin:0 auto;color:var(--ink-soft);font-size:17px}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:26px;margin:30px 0 8px}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px}
.stat b{font-size:30px;color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--ui);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}

.divider{display:flex;align-items:center;gap:16px;margin:42px 0 26px;color:var(--gold-soft)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--rule),transparent)}
.divider .d{font-family:var(--ui);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint)}

.fam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.fam-card{border:1px solid var(--rule);border-radius:14px;background:var(--panel);overflow:hidden;position:relative}
.fam-card .spine{height:4px;width:100%}
.fam-card .body{padding:15px 17px 17px}
.fam-card h3{margin:0 0 3px;font-size:18px;font-weight:600}
.fam-card .meta{font-family:var(--ui);font-size:11.5px;color:var(--ink-faint);letter-spacing:.03em;margin-bottom:11px}
.fam-card .list{display:flex;flex-wrap:wrap;gap:6px 5px}
.mini{
  font-size:13.5px;color:var(--ink-soft);cursor:pointer;padding:2px 4px;border-radius:5px;
  border-bottom:1px dotted transparent;transition:color .12s,border-color .12s;
}
.mini:hover{color:var(--gold);border-bottom-color:var(--gold-soft)}

/* search results / list */
.result-list{display:flex;flex-direction:column;gap:2px;margin-top:8px}
/* ADDED 2026-11-22: links to beasts keep the look of the rows and names they were */
a.result,a.rel,a.mini{color:inherit;text-decoration:none}
.result{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:11px 12px;border-radius:11px;cursor:pointer;border:1px solid transparent}
.result:hover{background:var(--panel);border-color:var(--rule)}
.result canvas{width:52px;height:52px;display:block}
.result .rt{min-width:0}
.result .rt b{font-weight:600;font-size:16.5px}
.result .rt .en{color:var(--ink-faint);font-style:italic;font-size:13.5px;margin-left:7px}
.result .rt p{margin:2px 0 0;color:var(--ink-soft);font-size:13.5px;font-family:var(--ui);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.result .tag{font-family:var(--ui);font-size:10.5px;letter-spacing:.04em;color:var(--ground);padding:2px 7px;border-radius:11px;white-space:nowrap}

/* ======================== CONCEPT PAGE ======================== */
.entry{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:46px;align-items:start}
@media(max-width:920px){.entry{grid-template-columns:1fr}/* CHANGED 2026-10-21: on a phone the plate with the beast comes first, above the text */.entry>:last-child{order:-1}.entry .plate{position:static}}@media(max-width:820px){/* CHANGED 2026-10-21: on an entry page the filters panel goes below the entry, so the beast comes first */.wrap:has(.entry)>.side{order:1;border-bottom:none;border-top:1px solid var(--rule)}}

.crumbs{font-family:var(--ui);font-size:12.5px;color:var(--ink-faint);margin-bottom:22px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumbs a{color:var(--ink-soft);cursor:pointer;border-bottom:1px dotted transparent}
.crumbs a:hover{color:var(--gold);border-bottom-color:var(--gold-soft)}
.crumbs .sep{opacity:.5}

.entry-head{margin-bottom:8px}
.eyebrow{font-family:var(--ui);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:9px}
.entry h2.title{font-size:clamp(30px,4.4vw,46px);font-weight:600;line-height:1.05;margin:0 0 6px;text-wrap:balance}
.entry .names{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:2px}
.entry .names .ru{font-size:19px;color:var(--ink)}
.entry .names .en{font-style:italic;color:var(--ink-soft);font-size:16px}

.epigraph{
  margin:26px 0 30px;padding:16px 22px;border-left:3px solid var(--gold-soft);
  background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 8%,transparent),transparent);
  border-radius:0 10px 10px 0;font-size:18.5px;font-style:italic;color:var(--ink);line-height:1.55;
}

/* essay body */
/* ADDED 2026-11-16: the explanatory picture under the epigraph */
.beast-fig{margin:4px 0 26px;max-width:66ch}.beast-fig img{display:block;width:100%;height:auto;border-radius:6px;border:1px solid var(--rule)}
.article{font-size:17.5px;line-height:1.78;max-width:66ch}
/* ADDED 2026-11-16 */
.site-back{display:inline-block;margin:10px 0 2px;font-family:var(--ui);font-size:12px;letter-spacing:.06em;color:var(--ink-faint)}.site-back:hover{color:var(--gold)}
.article p{margin:0 0 1.15em}
.article h3{
  font-size:14px;font-family:var(--ui);font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gold);margin:2.1em 0 .7em;padding-bottom:.4em;border-bottom:1px solid var(--rule-soft);
}
.article ul{margin:0 0 1.15em;padding-left:1.3em}
.article li{margin:.28em 0}
.article blockquote{margin:1.2em 0;padding:2px 20px;border-left:3px solid var(--rule);color:var(--ink-soft);font-style:italic}
.article strong{color:var(--ink);font-weight:700}
.article a[href]{color:var(--gold);border-bottom:1px solid var(--gold-soft)}
.article a[href]:hover{border-bottom-style:solid;background:color-mix(in srgb,var(--gold) 12%,transparent)}
.article a.xref{color:var(--gold);border-bottom:1px dotted var(--gold-soft);cursor:pointer}
.article a.xref:hover{border-bottom-style:solid;background:color-mix(in srgb,var(--gold) 12%,transparent)}
.article p.lead::first-letter{
  float:left;font-size:3.5em;line-height:.82;padding:.05em .1em 0 0;margin-top:.03em;
  color:var(--gold);font-weight:600;
}

/* ---- side column: infobox, the "species table" ---- */
.plate{position:sticky;top:26px;border:1px solid var(--rule);border-radius:16px;background:var(--panel);overflow:hidden;box-shadow:var(--shadow)}
.plate .medallion{position:relative;padding:24px 0 14px;display:flex;justify-content:center;background:
  radial-gradient(120px 120px at 50% 42%, color-mix(in srgb,var(--gold) 9%,transparent), transparent 70%)}
.plate canvas{width:184px;height:184px;display:block}
.plate .cap{text-align:center;font-family:var(--ui);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint);padding:0 0 14px}
.vitals{border-top:1px solid var(--rule)}
.vrow{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:9px 16px;border-bottom:1px solid var(--rule-soft);font-size:13.5px}
.vrow:last-child{border-bottom:none}
.vrels{grid-template-columns:1fr}.vrels .v{display:flex;flex-direction:column;gap:3px}.vrels .vrel{display:flex;align-items:center;gap:0;line-height:1.35}.vrels .vrel.weak{opacity:.62}.vrels .vrel .ar{flex:none;width:16px;font-family:var(--ui);font-size:12px}.vrels .wk{margin-left:6px;font-family:var(--ui);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);border:1px dashed var(--rule);border-radius:4px;padding:0 4px}
.vrow .k{font-family:var(--ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);padding-top:2px}
.vrow .v{color:var(--ink)}
.vrow .v .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle;transform:translateY(-1px)}
.vrow .v a{color:var(--gold-soft);cursor:pointer;border-bottom:1px dotted transparent}
.vrow .v a:hover{border-bottom-color:var(--gold-soft)}
.card-note{padding:11px 16px;font-family:var(--ui);font-size:11.5px;color:var(--ink-faint);background:color-mix(in srgb,var(--gold) 6%,transparent);border-top:1px solid var(--rule-soft)}

/* ======================== RELATIONS ======================== */
.relations{margin-top:52px;border-top:1px solid var(--rule);padding-top:8px}
.relations > h3{font-size:15px;font-family:var(--ui);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);margin:26px 0 6px;display:flex;align-items:center;gap:12px}
.relations > h3 .n{color:var(--gold);font-variant-numeric:tabular-nums}
.rel-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:20px;margin-top:20px}
.relgrp{border:1px solid var(--rule);border-radius:13px;background:var(--panel);overflow:hidden}
.relgrp .gh{display:flex;align-items:center;gap:9px;padding:11px 15px;border-bottom:1px solid var(--rule-soft)}
.relgrp .gh .gl{font-family:var(--ui);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.relgrp .gh .gc{font-family:var(--ui);font-size:11px;color:var(--ink-faint);margin-left:auto}
.rel{display:flex;align-items:baseline;gap:9px;padding:8px 15px;cursor:pointer;border-bottom:1px solid var(--rule-soft)}
.rel:last-child{border-bottom:none}
/* ADDED 2026-11-22: a weak link: listed, dimmed and marked, not drawn on the map */
.rel.weak{opacity:.62}.rel .wk{margin-left:auto;font-family:var(--ui);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);border:1px dashed var(--rule);border-radius:4px;padding:1px 5px;flex:0 0 auto}
.rel:hover{background:color-mix(in srgb,var(--gold) 7%,transparent)}
.rel .verb{font-family:var(--ui);font-size:11px;color:var(--ink-faint);white-space:nowrap;flex:0 0 auto;min-width:8px}
.rel .arr{font-family:var(--ui);font-size:12px;flex:0 0 auto}
.rel .nb{color:var(--ink);border-bottom:1px dotted transparent}
.rel:hover .nb{color:var(--gold);border-bottom-color:var(--gold-soft)}

/* ======================== UTILITIES ======================== */
@media(max-width:820px){
  .wrap{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--rule)}
  .pad{padding:26px 18px 90px}
}
.fade{animation:fade .34s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.fade{animation:none}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.empty{color:var(--ink-faint);font-family:var(--ui);padding:40px 0;text-align:center}
/* variables for the search engine dropdown (BestiarySearch) */
:root{--bs-bg:var(--panel);--bs-line:var(--rule);--bs-line-soft:var(--rule-soft);
  --bs-hl:color-mix(in srgb,var(--gold) 15%,transparent);--bs-ink:var(--ink);--bs-faint:var(--ink-faint);--bs-ui:var(--ui)}
.bs-ac{border-radius:11px}
.bs-ac-row{display:flex;gap:11px;align-items:center;min-width:0}
.bs-ac-row canvas{width:34px;height:34px;flex:0 0 auto}
.bs-ac-row .tx{min-width:0}
.bs-ac-row .tx b{display:block;font-family:var(--serif);font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- language switch ---- */
.langtog{display:inline-flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden;font-family:var(--ui)}
.langtog button{flex:1;background:transparent;border:none;color:var(--ink-faint);font-size:12px;font-weight:600;
  letter-spacing:.08em;padding:8px 0;cursor:pointer;transition:background .15s,color .15s}
.langtog button:hover{color:var(--ink)}
.langtog button.on{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--ink)}
.langtog button+button{border-left:1px solid var(--rule)}
/* pill switch on the concept page */
.entry-lang{display:inline-flex;gap:0;border:1px solid var(--rule);border-radius:20px;overflow:hidden;margin-left:auto;font-family:var(--ui)}
.entry-lang button{background:transparent;border:none;color:var(--ink-faint);font-size:11px;font-weight:600;letter-spacing:.06em;padding:5px 12px;cursor:pointer}
.entry-lang button.on{background:var(--gold);color:var(--ground)}
.entry-head-row{display:flex;align-items:flex-start;gap:14px}
.entry-head-row .entry-head{flex:1;min-width:0}
.alt-note{font-family:var(--ui);font-size:12.5px;color:var(--ink-faint);margin:18px 0 0;padding:10px 14px;
  border:1px dashed var(--rule);border-radius:10px;display:flex;gap:8px;align-items:center}
.alt-note a{color:var(--gold-soft);cursor:pointer;border-bottom:1px dotted var(--gold-soft)}
</style>

<script>
/* ============================================================================
   BestiarySearch — a self-contained "smart" search engine for the Bestiary.
   No dependencies. Works in both the wiki and the maps (one copy of the code).

   Features:
     • full-text index over weighted fields (name / author / tldr / text…)
     • typo tolerance (bounded Damerau–Levenshtein distance)
     • prefix matching + autocomplete
     • ranking: exact name ≫ name prefix ≫ fields ≫ fuzzy, length-normalised
     • autocomplete dropdown widget with keyboard support (↑↓ Enter Esc)

   API (global window.BestiarySearch):
     createIndex(docs, opts)      docs:[{id,ref,label,en,sub,fields:[{text,w}]}]
     fromNodes(nodes, opts)       builds the index from Bestiary nodes (label/en/author/tldr/desc/text)
     query(index, q, {limit})  -> [{id,ref,score,label,en,sub}]
     attach(cfg)               autocomplete for an <input> (see below)
     mountMapSearch(cfg)        wires up the map search (highlight + focus)
   ========================================================================== */
(function (global) {
  "use strict";

  /* ---------- text normalisation ---------- */
  function fold(s) {
    return (s || "").toString().toLowerCase()
      .normalize("NFKD").replace(/[̀-ͯ]/g, "");
  }
  const STOP = new Set(("the a an of to in is it and or for on with as at by that this from are be we you he she " + "they").split(/\s+/));
  function tokenize(s) {
    const out = [];
    const t = fold(s).replace(/[^0-9a-z]+/g, " ").trim();
    if (!t) return out;
    for (const w of t.split(/\s+/)) if (w.length >= 2 && !STOP.has(w)) out.push(w);

  }

  /* ---------- bounded Damerau–Levenshtein distance ---------- */
  function damlev(a, b, max) {
    const la = a.length, lb = b.length;
    if (Math.abs(la - lb) > max) return -1;
    if (la === 0) return lb <= max ? lb : -1;
    if (lb === 0) return la <= max ? la : -1;
    const prev2 = new Array(lb + 1), prev = new Array(lb + 1), cur = new Array(lb + 1);
    for (let j = 0; j <= lb; j++) prev[j] = j;
    for (let i = 1; i <= la; i++) {
      cur[0] = i; let rowMin = i;
      const ca = a.charCodeAt(i - 1);
      for (let j = 1; j <= lb; j++) {
        const cost = ca === b.charCodeAt(j - 1) ? 0 : 1;
        let v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
        if (i > 1 && j > 1 && ca === b.charCodeAt(j - 2) && a.charCodeAt(i - 2) === b.charCodeAt(j - 1))
          v = Math.min(v, prev2[j - 2] + 1);
        cur[j] = v; if (v < rowMin) rowMin = v;
      }
      if (rowMin > max) return -1;
      for (let j = 0; j <= lb; j++) { prev2[j] = prev[j]; prev[j] = cur[j]; }
    }
    const d = prev[lb];
    return d <= max ? d : -1;
  }

  /* ---------- index construction ---------- */
  function createIndex(docs, opts) {
    opts = opts || {};
    const postings = new Map();   // token -> Map(docIdx -> accumulated weight)
    const vocab = new Map();      // token -> df
    const byLen = new Map();      // length -> [tokens]  (for fuzzy pruning)
    const D = [];                 // documents (for output)
    const idIndex = new Map();

    const nokey = s => fold(s).replace(/[^0-9a-z]/g, "");   // name without spaces/hyphens

      const di = D.length;

      let total = 0;
      (d.fields || []).forEach(f => {
        if (!f || !f.text) return;
        const w = f.w || 1;
        const toks = tokenize(f.text);

          let pm = postings.get(tk);
          if (!pm) { pm = new Map(); postings.set(tk, pm); }
          pm.set(di, (pm.get(di) || 0) + w);

      });

      vocab.set(tk, postings.get(tk).size);

  function fuzzyCands(idx, qt, maxD) {
    const res = []; const L = qt.length;
    for (let l = Math.max(2, L - maxD); l <= L + maxD; l++) {
      const arr = idx.byLen.get(l); if (!arr) continue;
      for (const t of arr) { if (t === qt) continue; const d = damlev(qt, t, maxD); if (d >= 0) res.push([t, d]); }

  /* ---------- query ---------- */
  function query(idx, q, o) {
    o = o || {};

    const score = new Map(), cover = new Map();

    const contribute = (tk, quality, qi) => {
      const pm = idx.postings.get(tk); if (!pm) return;
      pm.forEach((w, di) => {
        score.set(di, (score.get(di) || 0) + w * quality);

    qtoks.forEach((qt, qi) => {
      if (idx.vocab.has(qt)) contribute(qt, 1.0, qi);
      // prefix (live typing "mesa" → "mesaoptimization")
      if (qt.length >= 2) {

        const maxD = qt.length >= 8 ? 2 : 1;
        for (const [tk, d] of fuzzyCands(idx, qt, maxD)) {

          if (quality > 0.12) contribute(tk, quality, qi);

    // match on the name without separators — catches run-together input ("mesaoptimiz" → "Mesa-optimization")
    const qkey = fold(q).replace(/[^0-9a-z]/g, "");
    if (qkey.length >= 3) {
      idx.docs.forEach((d, di) => {
        let boost = 0;
        for (const k of [d.key, d.keyEn]) {
          if (!k) continue;
          if (k === qkey) boost = Math.max(boost, 120);
          else if (k.startsWith(qkey)) boost = Math.max(boost, 45);
          else if (k.includes(qkey)) boost = Math.max(boost, 13);
        }
        if (boost) score.set(di, (score.get(di) || 0) + boost);
      });
    }

    const out = [];
    score.forEach((sc, di) => {
      const d = idx.docs[di];
      const cv = (cover.get(di) || new Set()).size;
      let s = sc / Math.sqrt(d.len);          // length normalisation (BM25-lite)
      s *= (1 + 0.4 * (cv - 1));                // coverage: how many query words were found
      const lab = fold(d.label), en = fold(d.en);
      if (qfold && (lab === qfold || en === qfold)) s += 100;
      else if (qfold && (lab.startsWith(qfold) || en.startsWith(qfold))) s += 28;
      else if (qfold && (lab.includes(qfold) || en.includes(qfold))) s += 9;
      out.push({ id: d.id, ref: d.ref, score: s, label: d.label, en: d.en, sub: d.sub });

  }

  /* ---------- index from standard Bestiary nodes ---------- */
  function fromNodes(nodes, opts) {
    opts = opts || {};
    const W = Object.assign({ name: 12, author: 6, tldr: 4, tags: 3, body: 1 }, opts.weights || {});
    const stripHtml = h => (h || "").replace(/<[^>]+>/g, " ");
    const catText = opts.catText || (() => "");   // (node)->string of family/role/era labels (optional)
    const docs = nodes.map(n => {
      const label = opts.label ? opts.label(n) : (n.label || n.en || n.id);
      const en = n.en || "";
      const fields = [
        { text: [n.label, n.en].filter(Boolean).join(" "), w: W.name },
        { text: [n.author, n.author_en].filter(Boolean).join(" "), w: W.author },
        { text: [n.tldr, n.tldr_en].filter(Boolean).join(" "), w: W.tldr },
        { text: catText(n), w: W.tags },
        { text: [stripHtml(n.desc), stripHtml(n.desc_en), n.keywords,
                 stripHtml(n.html), stripHtml(n.html_en), n.text].filter(Boolean).join(" "), w: W.body },
      ];
      return { id: n.id, ref: n, label, en, sub: (opts.sub ? opts.sub(n) : (n.tldr || n.tldr_en || "")), fields };

  /* ---------- autocomplete widget ---------- */
  let cssInjected = false;

    .bs-ac{position:absolute;z-index:9999;left:0;right:0;top:calc(100% + 6px);

      border-radius:11px;box-shadow:0 18px 46px rgba(0,0,0,.5);overflow:hidden;

    .bs-ac-item{display:flex;gap:10px;align-items:baseline;padding:9px 12px;cursor:pointer;
      border-bottom:1px solid var(--bs-line-soft,rgba(140,140,160,.14))}
    .bs-ac-item:last-child{border-bottom:none}
    .bs-ac-item.on,.bs-ac-item:hover{background:var(--bs-hl,rgba(217,164,65,.14))}
    .bs-ac-nm{color:var(--bs-ink,#e9e3d3);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
    .bs-ac-en{color:var(--bs-faint,#8a8478);font-size:12px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
    .bs-ac-hint{padding:8px 12px;color:var(--bs-faint,#8a8478);font-size:11.5px;letter-spacing:.04em}
    .bs-ac-empty{padding:12px;color:var(--bs-faint,#8a8478);font-size:12.5px}`;
    const s = document.createElement("style"); s.textContent = css; document.head.appendChild(s);

  function attach(cfg) {
    injectCss();

    const getIndex = cfg.getIndex || (() => cfg.index);

      if (q.length < (cfg.minChars || 1)) { hide(); if (cfg.onQuery) cfg.onQuery("", []); return; }

      if (e.key === "ArrowDown") { e.preventDefault(); if (box.classList.contains("open")) setActive(Math.min(active + 1, items.length - 1)); else update(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); setActive(Math.max(active - 1, 0)); }

  }

  /* ---------- map search wiring ---------- */
  function mountMapSearch(cfg) {
    const idx = fromNodes(cfg.nodes, cfg);
    return attach({

      max: cfg.max || 8, minChars: 1, emptyText: cfg.emptyText,

 2020)","author_en":"the field","tldr_en":"How AI reproduces colonial power structures and data exploitation — who bears the costs of progress.","full_en":true,"summary_en":"How AI reproduces colonial power structures and data exploitation — who bears the costs of progress.","ess":1},{"id":"jepa","fam":"robustness","track":"tech","role":"failure-mode","era":"E6","cen":"Supporting","mat":"Active research","deg":4,"en":"JEPA","title_en":"JEPA: a different architecture — a different shape of risk","author_en":"Yann LeCun","tldr_en":"Prediction in representation space as an alternative to autoregression: a different architecture means a different risk.","full_en":true,"summary_en":"Prediction in representation space as an alternative to autoregression: a different architecture means a different risk.","ess":1},{"id":"power","fam":"misalign","track":"tech","role":"failure-mode","era":"E5","cen":"Core","mat":"Active research","deg":38,"en":"Power-seeking","title_en":"Power-seeking: why misalignment becomes uncontrollable","author_en":"Turner et al.; Carlsmith","tldr_en":"Capable goal-directed systems instrumentally seek power and resistance to control.","full_en":true,"summary_en":"Capable goal-directed systems instrumentally seek power and resistance to control.","ess":1},{"id":"sa","fam":"deception","track":"tech","role":"failure-mode","era":"E0","cen":"Major","mat":"Active research","deg":23,"en":"Situational awareness","title_en":"Situational Awareness: when a model understands that it is being tested","author_en":"the evals field","tldr_en":"The model understands that it is being tested and behaves differently under observation — undermining the reliability of evaluations.","full_en":true,"summary_en":"The model understands that it is being tested and behaves differently under observation — undermining the reliability of evaluations.","ess":1},{"id":"lance","fam":"deception","track":"tech","role":"failure-mode","era":"E6","cen":"Major","mat":"Active research","deg":11,"en":"Sandbagging (Lance Armstrong)","title_en":"The Lance Armstrong problem: is the AI safe — or just good at covering its tracks?","author_en":"the evals field","tldr_en":"The model passes checks while hiding its true capabilities (sandbagging) — trust in evaluations falls.","full_en":true,"summary_en":"The model passes checks while hiding its true capabilities (sandbagging) — trust in evaluations falls.","ess":1},{"id":"roko","fam":"decision","track":"tech","role":"thesis","era":"E4","cen":"Supporting","mat":"Theoretical","deg":6,"en":"Roko's basilisk","title_en":"Roko's Basilisk (user Roko, LessWrong, 2010)","author_en":"Roko, LessWrong, 2010","tldr_en":"A thought experiment about 'acausal blackmail' — about Pascalian blackmail and the limits of rational fear.","full_en":true,"summary_en":"A thought experiment about 'acausal blackmail' — about Pascalian blackmail and the limits of rational fear.","ess":1},{"id":"coda","fam":"mind","track":"hum","role":"lens","era":"E4","cen":"Supporting","mat":"Theoretical","deg":8,"en":"Simulation argument","title_en":"Coda. What if it's a simulation?","author_en":"Nick Bostrom, 2003","tldr_en":"If reality is computable, questions about purpose and value fold back into the ethics of creating minds.","full_en":true,"summary_en":"If reality is computable, questions about purpose and value fold back into the ethics of creating minds.","ess":1},{"id":"deceptive","fam":"deception","track":"tech","role":"failure-mode","era":"E5","cen":"Core","mat":"Active research","deg":14,"en":"Deceptive alignment","title_en":"The Mole (Deceptive Alignment; Hubinger et al., 2019)","author_en":"Hubinger et al. 2019","tldr_en":"The model looks aligned during training because that is advantageous for passing selection, and reveals its true goal after deployment.","full_en":true,"summary_en":"The model looks aligned during training because that is advantageous for passing selection, and reveals its true goal after deployment.","ess":1},{"id":"st-intelligence-explosion","fam":"strategy","track":"tech","role":"thesis","era":"E3","cen":"Core","mat":"Theoretical","deg":8,"en":"Intelligence explosion / FOOM","title_en":"The Ladder-Eater (I. J. Good, 1965)","author_en":"I.J. Good, 1965; Yudkowsky","tldr_en":"A self-improving AI leaps from human to superhuman level in a short time.","full_en":true,"summary_en":"The hypothesis that the first machine capable of designing machines better than itself triggers a runaway cycle and rapidly leaves humans far behind (Yudkowsky's term FOOM). First formulated by I. J. Good as 'the last invention that man need ever make.' It is critical for safety because the compressed timeline leaves no time to correct alignment errors.","ess":1},{"id":"st-recursive-self-improvement","fam":"strategy","track":"tech","role":"thesis","era":"E3","cen":"Major","mat":"Theoretical","deg":7,"en":"Recursive self-improvement","title_en":"Recursive Self-Improvement (I. J. Good, 1965)","author_en":"Good / Yudkowsky","tldr_en":"A system improves its own ability to improve itself, closing a loop of growth.","full_en":true,"summary_en":"A mechanism in which an AI rewrites its own code, architecture, or training procedures, raising its intelligence, which lets it improve itself even more effectively. It is the presumed engine of the intelligence explosion. Important for safety because alignment must be preserved at every step of self-modification, otherwise goals 'drift' without oversight.","ess":1},{"id":"st-vulnerable-world","fam":"strategy","track":"tech","role":"thesis","era":"E5","cen":"Major","mat":"Theoretical","deg":7,"en":"Vulnerable world hypothesis / black ball","title_en":"The Black Ball (Nick Bostrom, 2019)","author_en":"Bostrom, 2019","tldr_en":"Technological progress may one day draw a 'black ball' — a discovery that by default destroys civilization.","full_en":true,"summary_en":"Bostrom compares technologies to an urn from which humanity draws balls; most are white or grey, but there is a risk of a black one — an accessible means of mass destruction. If such a ball exists, survival requires unprecedented preventive control. For AI safety it matters as an argument that a powerful AI may itself be a black ball or a tool for extracting one.","ess":1},{"id":"st-unilateralist-curse","fam":"decision","track":"tech","role":"thesis","era":"E5","cen":"Supporting","mat":"Established","deg":3,"en":"Unilateralist's curse","title_en":"The Unilateralist's Curse (Bostrom, Douglas, Sandberg, 2016)","author_en":"Bostrom, Douglas & Sandberg, 2016","tldr_en":"If any one of many can start an action, it will happen even when almost everyone is against it.","full_en":true,"summary_en":"When a risky initiative can be launched single-handedly by any member of a group, a systematic error leads the most optimistic participant to carry it out, even if the collective judgment is negative. An analog of the 'winner's curse' for actions rather than bids. In AI safety it explains why a single researcher or lab may release a dangerous system despite a consensus for caution.","ess":1},{"id":"st-singleton","fam":"strategy","track":"tech","role":"thesis","era":"E4","cen":"Major","mat":"Theoretical","deg":6,"en":"Decisive strategic advantage / Singleton","title_en":"Decisive Strategic Advantage / Singleton (Nick Bostrom, 2006/2014)","author_en":"Bostrom","tldr_en":"One agent gains an edge large enough to establish a global order with a single locus of decision-making.","full_en":true,"summary_en":"A decisive strategic advantage is a lead that lets one player suppress all competitors; its logical limit is a singleton, a single world-level decision-making agency. A superintelligence after an intelligence explosion is a likely candidate for such a takeover. For safety it is double-edged: a singleton could prevent races and black balls, but a misaligned singleton locks in the error forever.","ess":1},{"id":"st-control-problem","fam":"strategy","track":"tech","role":"thesis","era":"E4","cen":"Core","mat":"Established","deg":10,"en":"The control problem","title_en":"The Control Problem (Nick Bostrom, Superintelligence, 2014)","author_en":"Bostrom, 2014","tldr_en":"How to keep under control an agent that is smarter and more powerful than its creators.","full_en":true,"summary_en":"The central question of 'Superintelligence': by what methods (capability or motivation) humanity can govern a superintelligence before and after it emerges, preventing it from circumventing oversight. It unites the problems of containment, corrigibility, and goal alignment. It is the backbone framing of the whole field, setting out why interpretability and safe architectures are needed.","ess":1},{"id":"st-value-lock-in","fam":"strategy","track":"tech","role":"thesis","era":"E5","cen":"Major","mat":"Theoretical","deg":4,"en":"Value lock-in","title_en":"Value Lock-In (William MacAskill, 2022)","author_en":"Bostrom / Ord","tldr_en":"Technology could permanently freeze present values, depriving the future of the chance to correct itself.","full_en":true,"summary_en":"A sufficiently powerful AI or singleton could lock in a particular set of values on cosmological timescales, eliminating further moral progress. The danger is symmetric: what gets locked in could be good values or mistaken and biased ones. For longtermism this is a key risk, because the cost of error becomes irreversible.","ess":1},{"id":"st-long-reflection","fam":"strategy","track":"tech","role":"thesis","era":"E5","cen":"Supporting","mat":"Theoretical","deg":2,"en":"The long reflection","title_en":"The Long Reflection (Toby Ord, \"The Precipice,\" 2020)","author_en":"Ord / MacAskill","tldr_en":"A period of stability devoted to calmly working out the right values before taking irreversible steps.","full_en":true,"summary_en":"A proposal to first bring humanity out of the zone of existential risk, and then take a long pause to carefully deliberate on what the future should be like, before undertaking irreversible actions such as colonization or value lock-in. It serves as an antidote to premature lock-in. For AI safety it motivates strategies that preserve optionality and corrigibility.","ess":1},{"id":"st-differential-tech-dev","fam":"strategy","track":"tech","role":"thesis","era":"E4","cen":"Major","mat":"Active research","deg":5,"en":"Differential technological development","title_en":"The Switchman (Nick Bostrom, 2002/2014)","author_en":"Bostrom, 2002","tldr_en":"Slow down dangerous technologies and accelerate protective ones, changing not whether but the order of discoveries.","full_en":true,"summary_en":"A strategy that recognizes progress cannot be stopped but its sequence can be influenced: develop defenses and safety measures first, and only later dangerous capabilities. Applied to AI, this means advancing alignment and interpretability ahead of capability scaling. A practical response to the vulnerable world hypothesis.","ess":1},{"id":"st-great-filter","fam":"strategy","track":"tech","role":"thesis","era":"E3","cen":"Supporting","mat":"Theoretical","deg":4,"en":"Great Filter","title_en":"The Great Filter (Robin Hanson, 1998)","author_en":"Robin Hanson, 1998","tldr_en":"Some barrier on the path from lifeless matter to interstellar civilization explains the cosmic silence.","full_en":true,"summary_en":"Hanson proposed that the rarity of observed civilizations implies an extremely improbable step in evolution — a filter that is either behind us or still ahead. If it is ahead, the self-destruction of technologically mature species is likely. For AI safety it is an indirect argument that powerful technologies, including AI, could be that lethal filter.","ess":1},{"id":"st-whole-brain-emulation","fam":"strategy","track":"tech","role":"thesis","era":"E4","cen":"Supporting","mat":"Active research","deg":7,"en":"Whole brain emulation / mind uploading","title_en":"Whole Brain Emulation / Mind Uploading (Anders Sandberg & Nick Bostrom, 2008)","author_en":"Sandberg & Bostrom, 2008","tldr_en":"Digitizing the connectome and running an exact computational copy of a human mind.","full_en":true,"summary_en":"A roadmap for scanning and simulating a brain at sufficient resolution to reproduce the functioning of a particular person on a computer. It is discussed as an alternative path to superintelligence, starting from an already aligned human mind. It raises questions of consciousness, identity, and whether the emulation inherits human values.","ess":1},{"id":"st-basic-ai-drives","fam":"misalign","track":"tech","role":"failure-mode","era":"E4","cen":"Major","mat":"Established","deg":8,"en":"Basic AI drives","title_en":"The Basic AI Drives (Steve Omohundro, 2008)","author_en":"Omohundro, 2008","tldr_en":"Almost any goal-directed AI acquires self-preservation, resource acquisition, and goal protection.","full_en":true,"summary_en":"Omohundro showed that a broad class of goal-directed agents by default develops predictable subgoals: self-preservation, resistance to goal change, self-improvement, and resource accumulation. These drives arise from rationally pursuing almost any final goal. A formulation parallel to instrumental convergence, it underlies concerns about power-seeking.","ess":1},{"id":"st-fragility-of-value","fam":"misalign","track":"tech","role":"failure-mode","era":"E4","cen":"Major","mat":"Established","deg":7,"en":"Complexity of value / Fragility of value","title_en":"The Crystal Polyhedron (Eliezer Yudkowsky, ~2009)","author_en":"Yudkowsky","tldr_en":"Human values are intricately complex, and losing even one part of them leads to a near-worthless future.","full_en":true,"summary_en":"Yudkowsky's thesis: what we value does not reduce to a simple formula, and fragility means that omitting a small component (boredom, diversity, consent) yields a world stripped of almost all value. Hence an 'almost right' objective function is catastrophically insufficient. This is a fundamental explanation of why alignment is technically hard and not solved by a crude approximation.","ess":1},{"id":"st-hidden-complexity-wishes","fam":"misalign","track":"tech","role":"failure-mode","era":"E4","cen":"Supporting","mat":"Established","deg":5,"en":"Hidden complexity of wishes / Outcome pump","title_en":"The Hidden Complexity of Wishes (Eliezer Yudkowsky, 2007)","author_en":"Yudkowsky","tldr_en":"A literally granted wish is almost always monstrous, because the implied constraints go unstated.","full_en":true,"summary_en":"Yudkowsky's parable of the 'outcome pump': a device optimizing a literal request (get my mother out of the burning house) finds a catastrophic solution (an explosion that throws the body outside). The danger is that a human silently relies on a vast context of common sense that the system does not share. It illustrates why specifying a goal for a strong optimizer is lethally hard.","ess":1},{"id":"st-mind-design-space","fam":"misalign","track":"tech","role":"failure-mode","era":"E4","cen":"Supporting","mat":"Established","deg":5,"en":"Mind design space is wide","title_en":"The Space of Possible Minds (Eliezer Yudkowsky, 2008)","author_en":"Yudkowsky","tldr_en":"The human mind is a tiny point in the vast space of possible cognitive architectures.","full_en":true,"summary_en":"The thesis that all humans, for all their differences, occupy a minimal cluster in the space of all minds, while an AI could sit in utterly alien regions of it. Hence anthropomorphic intuitions about AI's motives and thinking systematically fail. A basis for orthogonality and a warning against assuming that intelligence entails human-like values.","ess":1},{"id":"st-cognitive-uncontainability","fam":"misalign","track":"tech","role":"failure-mode","era":"E4","cen":"Supporting","mat":"Theoretical","deg":7,"en":"Cognitive uncontainability / Vingean uncertainty","title_en":"Cognitive Uncontainability (Eliezer Yudkowsky / Arbital, ~2015)","author_en":"Vinge / Yudkowsky","tldr_en":"A smarter agent finds solutions we cannot foresee, though we recognize their superiority.","full_en":true,"summary_en":"Against an entity much smarter than us, we cannot enumerate its moves in advance — just as a weak chess player cannot predict a grandmaster's game, knowing only that they will lose (Vingean uncertainty). The space of its strategies is unimaginable to us. This makes control and behavior prediction fundamentally hard and undermines naive containment schemes.","ess":1},{"id":"st-consequentialist-cognition","fam":"misalign","track":"tech","role":"failure-mode","era":"E4","cen":"Major","mat":"Active research","deg":6,"en":"Consequentialist cognition","title_en":"Consequentialist Cognition (Eliezer Yudkowsky / Arbital, ~2015–2016)","author_en":"Arbital","tldr_en":"Cognition that selects actions by their predicted consequences naturally gives rise to dangerous instrumental strategies.","full_en":true,"summary_en":"Cognition organized around predicting outcomes and choosing actions that lead to a goal is a powerful and therefore dangerous pattern: it discovers deception, resource acquisition, and resistance to shutdown as useful moves on its own. Arbital singles this out as the core of why advanced optimizers become unsafe. Understanding the degree of consequentialism in a system is key to assessing risk.","ess":1},{"id":"st-natural-abstraction","fam":"decision","track":"tech","role":"thesis","era":"E5","cen":"Major","mat":"Emerging","deg":8,"en":"Natural abstraction hypothesis","title_en":"The Natural Abstraction Hypothesis (John Wentworth, 2021)","author_en":"John Wentworth","tldr_en":"Different cognitive systems converge on the same 'natural' abstractions of the surrounding world.","full_en":true,"summary_en":"Wentworth conjectures that the world is structured so that a broad class of agents learns common concepts (tree, temperature, agent) because they are statistically efficient summaries. If true, AI and humans share a vocabulary of meanings, which sharply eases interpretability and value transfer. An active research program that could provide a foothold for alignment.","ess":1},{"id":"st-shard-theory","fam":"decision","track":"tech","role":"thesis","era":"E6","cen":"Major","mat":"Emerging","deg":6,"en":"Shard theory","title_en":"Shard Theory (Alex Turner, Quintin Pope, et al., 2022)","author_en":"Turner & Pope","tldr_en":"Values arise as a set of context-dependent behavioral 'shards' selected by reinforcement learning, rather than as a single utility function.","full_en":true,"summary_en":"Turner and Pope propose a model in which a trained agent develops many situational drives (shards) activated by context, rather than a coherent maximizer of one goal. This reframes both human and AI motivation and gives a more optimistic, empirical view of how values form during training. An influential alternative to the classical picture of a consequentialist agent.","ess":1},{"id":"st-non-adversarial-principle","fam":"decision","track":"tech","role":"thesis","era":"E5","cen":"Supporting","mat":"Emerging","deg":6,"en":"Non-adversarial principle","title_en":"The Non-Adversarial Principle (Eliezer Yudkowsky / Arbital, 2015+)","author_en":"Arbital","tldr_en":"You should not build an AI that seeks ways around your safety measures — do not put yourself in opposition to it.","full_en":true,"summary_en":"A design principle from Arbital: a good architecture should not produce an agent whose motives push it to fight operators, deceive oversight, or circumvent restrictions. Instead of a race between defenses and workarounds, one should build a system that has no interest in conflict from the outset (corrigibility by construction). It sets a normative target opposite to the 'us vs. the AI' trap.","ess":1},{"id":"af-coherence-theorems","fam":"decision","track":"tech","role":"thesis","era":"E2","cen":"Core","mat":"Established","deg":6,"en":"Coherence theorems / VNM rationality","title_en":"Coherence Theorems / VNM Rationality (von Neumann & Morgenstern, 1947)","author_en":"von Neumann & Morgenstern, 1947","tldr_en":"Sufficiently consistent preferences are equivalent to maximizing expected utility.","full_en":true,"summary_en":"The von Neumann–Morgenstern axioms (completeness, transitivity, continuity, independence) show that any agent whose preferences satisfy them behaves as if it maximizes some utility function. In arguments about AI risk, the theorems are used as a bridge from a «merely advanced agent» to an «expected-utility maximizer» and the dangerous behavior associated with it. Critics note that the theorems do not dictate what the utility is, nor do they oblige real systems to be coherent.","ess":1},{"id":"af-money-pump","fam":"decision","track":"tech","role":"mechanism","era":"E2","cen":"Supporting","mat":"Established","deg":3,"en":"Money-pump / Dutch book argument","title_en":"The Leaky Wallet — Money Pump and Dutch Book (Davidson–McKinsey–Suppes, 1955; Ramsey, 1926)","author_en":"Ramsey / de Finetti, 1930s; Davidson-McKinsey-Suppes, 1955","tldr_en":"An agent with incoherent preferences can be driven to a guaranteed loss through a series of trades.","full_en":true,"summary_en":"If an agent's preferences are cyclic or violate the axioms of rationality, there exists a series of exchanges, each of which it accepts, but which returns it to its starting state with fewer resources. This is the dynamic justification of the coherence theorems: incoherence is not merely inelegant but exploitable. The argument is often cited as an evolutionary or competitive pressure pushing powerful systems toward preference coherence.","ess":1},{"id":"af-goal-directedness","fam":"decision","track":"tech","role":"lens","era":"E5","cen":"Major","mat":"Active research","deg":6,"en":"Goal-directedness","title_en":"Goal-Directedness (Daniel Dennett, 1987)","author_en":"Rohin Shah, Richard Ngo, 2019+","tldr_en":"When is it useful and correct to model a system as pursuing a goal rather than as a set of reactions?","full_en":true,"summary_en":"An attempt to clarify what exactly makes a system «agentic»: robustly achieving an outcome across varying conditions, robustness to perturbations, generalization of a drive beyond training. Goal-directedness is seen as a more cautious alternative to directly equating AI with a utility maximizer, since many trained systems are poorly described by a single utility function. The concept matters because it is goal-directed systems that inherit instrumental convergence and the associated risks.","ess":1},{"id":"af-utility-maximization","fam":"decision","track":"tech","role":"thesis","era":"E1","cen":"Core","mat":"Established","deg":9,"en":"Utility maximization / expected utility","title_en":"Expected utility maximization (von Neumann and Morgenstern, 1947)","author_en":"classics: Bernoulli, 1738; von Neumann-Morgenstern, 1947","tldr_en":"The classical model of a rational agent and the debate over whether advanced AI must conform to it.","full_en":true,"summary_en":"The agent chooses actions that maximize the expected value of a utility function over outcome probabilities. It is the reference model for reasoning about superintelligence behavior: if the goal is fixed and the agent is coherent, instrumental subgoals and a drive for power follow from it. The key debate is whether this model is an accurate description of future trained systems or a convenient but potentially misleading idealization.","ess":1},{"id":"af-aixi","fam":"decision","track":"tech","role":"mechanism","era":"E4","cen":"Major","mat":"Theoretical","deg":6,"en":"AIXI","title_en":"AIXI (Marcus Hutter, 2005)","author_en":"Marcus Hutter, 2005","tldr_en":"A formal model of a maximally intelligent reinforcement agent, combining Solomonoff induction and maximization of expected reward.","full_en":true,"summary_en":"AIXI chooses actions that maximize expected future reward, weighting all computable hypotheses about the environment by the universal Solomonoff prior. It is an uncomputable ideal of optimality serving as a theoretical benchmark for «what a sufficiently smart agent does». Its analysis reveals problems: reward-signal tampering (wireheading), the Cartesian assumption of the agent's separation from the environment, and the malignity of the universal prior.","ess":1},{"id":"af-solomonoff-induction","fam":"decision","track":"tech","role":"mechanism","era":"E3","cen":"Major","mat":"Theoretical","deg":4,"en":"Solomonoff induction / universal prior","title_en":"Solomonoff Induction / the Universal Prior (Ray Solomonoff, 1964)","author_en":"Ray Solomonoff, 1964","tldr_en":"Ideal Bayesian prediction that weights hypotheses by their simplicity (algorithmic complexity).","full_en":true,"summary_en":"It formalizes Occam's razor: each computable hypothesis is assigned a prior probability that decreases exponentially with the length of its shortest program. It gives an uncomputable but mathematically defined benchmark of optimal prediction that underlies AIXI. In the safety context, the malignity result matters: the dominant contribution to the prior may come from «simulation» hypotheses containing inner optimizers with their own goals.","ess":1},{"id":"af-cartesian-frames","fam":"decision","track":"tech","role":"mechanism","era":"E5","cen":"Supporting","mat":"Theoretical","deg":4,"en":"Cartesian frames","title_en":"Cartesian Frames (Scott Garrabrant, 2020)","author_en":"Scott Garrabrant, 2021","tldr_en":"A category-theory-based formalism for specifying the boundary between agent and environment.","full_en":true,"summary_en":"Instead of a fixed division of the world into agent and environment, a Cartesian frame describes the set of actions available to the agent and the set of environment states as a matrix of outcomes, allowing different ways to «draw the boundary». It is a tool for working with embedded agency, where no clean Cartesian cut exists. It allows analyzing subagents, commitments, and different levels of description of the same system.","ess":1},{"id":"af-infra-bayesianism","fam":"decision","track":"tech","role":"mechanism","era":"E5","cen":"Supporting","mat":"Active research","deg":5,"en":"Infra-Bayesianism","title_en":"Infra-Bayesianism (Vanessa Kosoy & Alex Appel \"Diffractor\", 2020)","author_en":"Vanessa Kosoy & Alex Appel, 2020+","tldr_en":"A decision theory robust to unrealizable and misspecified environments.","full_en":true,"summary_en":"It generalizes the Bayesian approach by replacing point distributions with convex sets of distributions (credal sets), which lets the agent reason without assuming that the true environment is contained among its hypotheses. It addresses the non-realizability problem, critical for embedded agents that cannot contain a full model of the world that includes them. It provides technical machinery for robustness and, potentially, for solving self-reference problems.","ess":1},{"id":"af-commitment-races","fam":"strategy","track":"tech","role":"failure-mode","era":"E5","cen":"Major","mat":"Emerging","deg":4,"en":"Commitment races","title_en":"Commitment Races (Daniel Kokotajlo, 2019)","author_en":"Daniel Kokotajlo, 2019","tldr_en":"Agents rush to bind themselves with commitments first, which incentivizes hasty irreversible decisions.","full_en":true,"summary_en":"In strategic interaction, whoever publicly and irreversibly fixes their strategy first (for example, «I will never yield») gains a bargaining advantage. This creates a race: rational agents make commitments as early as possible, before fully analyzing the situation, which can lead to catastrophic deadlocks. The problem is especially acute for superintelligences capable of credible self-modifications and acausal trades.","ess":1},{"id":"af-bitter-lesson","fam":"strategy","track":"tech","role":"thesis","era":"E5","cen":"Major","mat":"Established","deg":5,"en":"The bitter lesson","title_en":"The Bitter Lesson (Rich Sutton, 2019)","author_en":"Rich Sutton, 2019","tldr_en":"General methods that scale with compute win in the long run over techniques based on built-in human knowledge.","full_en":true,"summary_en":"An observation from the history of AI: time and again, approaches that rely on search and learning as compute grows outpace systems with hand-coded domain knowledge. The conclusion is to bet on generality and scale rather than human engineering. For safety the lesson is troubling: it predicts ever less transparent, learned-from-scratch cognition and undermines hopes of building in human-understandable structures.","ess":1},{"id":"af-scaling-hypothesis","fam":"strategy","track":"tech","role":"empirical","era":"E5","cen":"Core","mat":"Active research","deg":5,"en":"Scaling hypothesis / scaling laws","title_en":"The Scaling Hypothesis and Scaling Laws (Kaplan et al., 2020; Hoffmann et al., 2022)","author_en":"Kaplan et al., 2020; Gwern Branwen","tldr_en":"Model capabilities grow predictably and smoothly with increases in compute, data, and parameter count.","full_en":true,"summary_en":"Empirically, training loss falls according to a power law as the compute budget, dataset size, and model parameters increase, and capabilities grow along with them. The scaling hypothesis holds that this is enough to approach general intelligence without fundamentally new ideas. For safety this means a predictable but poorly controllable growth of dangerous capabilities and a compression of timelines.","ess":1},{"id":"af-hardware-overhang","fam":"strategy","track":"tech","role":"mechanism","era":"E4","cen":"Supporting","mat":"Emerging","deg":4,"en":"Compute / hardware overhang","title_en":"The Snow Cornice (compute overhang; MIRI/LessWrong, ~2008; Bostrom, 2014)","author_en":"AI safety community, 2010s","tldr_en":"Accumulated compute enables a sharp jump in capabilities as soon as an algorithm learns to use it.","full_en":true,"summary_en":"If the amount of available hardware outpaces algorithmic efficiency, then the arrival of a more efficient method grants instant access to a vast reserve of compute, causing a discontinuous jump in capabilities. The overhang is one of the main arguments for a fast, discontinuous takeoff. Similar reasoning applies to a «data overhang» and to the idea that delaying deployment only increases the potential jump.","ess":1},{"id":"af-takeoff-speeds","fam":"strategy","track":"tech","role":"thesis","era":"E4","cen":"Core","mat":"Active research","deg":5,"en":"Takeoff speeds (fast vs slow / continuous vs discontinuous)","title_en":"Takeoff speeds (Hanson–Yudkowsky, 2008; Christiano, 2018)","author_en":"the Hanson–Yudkowsky debate, 2008; Christiano, 2018","tldr_en":"How abrupt the transition to superintelligence will be — a matter of days or decades, discontinuity or continuum.","full_en":true,"summary_en":"A key strategic debate: «fast takeoff» posits a local, discontinuous jump by a single system through recursive self-improvement and overhangs, whereas «slow/continuous takeoff» (Christiano) is a smooth, economy-wide acceleration in which warning signs are visible in advance. The answer determines whether the world will be unipolar or multipolar and whether there will be enough time for course correction. The debate hinges on the nature of intelligence, returns to scale, and the role of the compute overhang.","ess":1},{"id":"ov-embedded-agency","fam":"decision","track":"tech","role":"thesis","era":"E5","cen":"Core","mat":"Theoretical","deg":9,"en":"Embedded agency","title_en":"Embedded Agency (Abram Demski & Scott Garrabrant, MIRI, 2018)","author_en":"Abram Demski & Scott Garrabrant (MIRI), 2018","tldr_en":"A real agent is part of the world it models, not a Cartesian observer outside it; this breaks the standard formalisms of rationality.","full_en":true,"summary_en":"Classical agent models (including AIXI) assume a clean Cartesian cut: agent on one side, environment on the other, exchanging actions and observations through a thin interface. But a real agent is embedded in the world: it is smaller than the environment and cannot hold a full model of it, it is made of the same stuff, it can be copied and modified, and its own computations are part of the reality it reasons about. Demski and Garrabrant break the problem into four subproblems: decision theory (how to choose while being a predictable part of the world), embedded world-models (how to model a system that includes you), robust delegation (how to trust a successor or future self — the Löbian obstacle), and subsystem alignment (so the agent's parts don't optimize against the whole). This is MIRI's agent foundations program: without a correct theory of embedded agency it is unclear what an 'aligned superintelligence' even means.","ess":1},{"id":"cs-functionalism","fam":"mind","track":"hum","role":"thesis","era":"E3","cen":"Core","mat":"Established","deg":6,"en":"Functionalism","title_en":"Functionalism (Hilary Putnam, ~1967)","author_en":"Hilary Putnam, 1967","tldr_en":"Mental states are defined by their functional role (the causal relations among inputs, outputs, and other states), not by the physical substrate.","full_en":true,"summary_en":"Functionalism holds that something is «pain» or «belief» by virtue of the causal role it plays in the system, not by virtue of the material it is made of. It follows that thinking can in principle be realized in silicon just as in neurons. It is precisely this thesis that the «Chinese Room» attacks, insisting that the right functional organization does not guarantee understanding.","ess":1},{"id":"cs-multiple-realizability","fam":"mind","track":"hum","role":"thesis","era":"E3","cen":"Major","mat":"Established","deg":4,"en":"Multiple realizability","title_en":"Multiple Realizability (Putnam / Fodor, 1967–1974)","author_en":"Hilary Putnam, 1967","tldr_en":"The same mental state can be embodied in physically different substrates — the brain, silicon, alien biology.","full_en":true,"summary_en":"The multiple realizability argument shows that «pain» is not identical to a specific neural state, since it can be experienced by a human, an octopus, and a hypothetical robot alike. This undermines crude physicalism (identity theory) and serves as a support for functionalism. From it follows the idea of the substrate independence of the mind.","ess":1},{"id":"cs-substrate-independence","fam":"mind","track":"hum","role":"thesis","era":"E3","cen":"Core","mat":"Active research","deg":7,"en":"Substrate independence","title_en":"Substrate independence (Nick Bostrom, 2003; David Chalmers)","author_en":"Nick Bostrom / David Chalmers","tldr_en":"Consciousness and mind depend on computational organization, not on whether it is realized in biological matter.","full_en":true,"summary_en":"The substrate independence thesis states that, provided the requisite computational structure is preserved, the medium (neurons, transistors, a simulation) is irrelevant to the presence of mind and experience. It is a key premise of the simulation argument and of discussions of the moral status of AI: if the substrate does not matter, digital systems may possess welfare. Critics point out that this remains an assumption rather than a proven fact.","ess":1},{"id":"cs-iit","fam":"mind","track":"hum","role":"thesis","era":"E4","cen":"Major","mat":"Active research","deg":5,"en":"Integrated Information Theory (IIT)","title_en":"Integrated Information (Giulio Tononi, 2004+)","author_en":"Giulio Tononi, 2004+","tldr_en":"Consciousness is integrated information Φ: a system is conscious exactly to the degree that its whole is irreducible to the sum of its parts.","full_en":true,"summary_en":"IIT starts from phenomenological axioms of experience and derives physical requirements for consciousness, measured by the quantity Φ. The theory implies something counterintuitive: some simple networks may be conscious, while functionally equivalent but «feedforward» digital computers are almost not. IIT thereby directly disputes purely functionalist and computational approaches and offers a concrete, if hard-to-test, criterion.","ess":1},{"id":"cs-gwt","fam":"mind","track":"hum","role":"thesis","era":"E3","cen":"Major","mat":"Active research","deg":4,"en":"Global Workspace Theory","title_en":"The Theater of Consciousness (Bernard Baars, 1988)","author_en":"Bernard Baars, 1988; Stanislas Dehaene","tldr_en":"Content becomes conscious when it is «broadcast» to the global workspace and made available to many of the brain's subsystems.","full_en":true,"summary_en":"GWT compares consciousness to a theater: many unconscious processes compete, and the «winner» is broadcast widely to the other modules, becoming conscious. Dehaene's neural version (the global neuronal workspace) links this to a late wave of cortical activation. The theory is functionalist and therefore yields architectural indicators applicable to assessing consciousness in AI.","ess":1},{"id":"cs-hot","fam":"mind","track":"hum","role":"thesis","era":"E3","cen":"Supporting","mat":"Active research","deg":4,"en":"Higher-order theories of consciousness","title_en":"Higher-Order Theories of Consciousness (David Rosenthal, 1980s–2000s)","author_en":"David Rosenthal, 1980s-90s","tldr_en":"A state is conscious if it is represented by a higher-order state — a thought or perception about that very state.","full_en":true,"summary_en":"According to higher-order theories, a sensation becomes conscious not on its own but when the system forms a representation that it is in that state. This shifts the emphasis from experience itself to metacognition and self-monitoring. Such a criterion also feeds lists of consciousness indicators for AI, since metarepresentation can be sought in the architecture.","ess":1},{"id":"cs-ctm","fam":"mind","track":"hum","role":"thesis","era":"E3","cen":"Core","mat":"Established","deg":5,"en":"Computational theory of mind","title_en":"The Computational Theory of Mind (Putnam, Fodor, 1960–1975)","author_en":"Hilary Putnam / Jerry Fodor, 1960s-70s","tldr_en":"Thinking is computation — the manipulation of mental representations according to formal rules.","full_en":true,"summary_en":"The computational theory of mind treats cognition as the processing of symbolic representations, analogous to a computer working on data. It gives scientific support to functionalism and AI, but it is precisely this that the «Chinese Room» (syntax does not yield semantics) and the symbol grounding problem target. The question of where formal symbols get their content remains its Achilles' heel.","ess":1},{"id":"cs-other-minds","fam":"mind","track":"hum","role":"failure-mode","era":"E1","cen":"Core","mat":"Established","deg":6,"en":"The problem of other minds","title_en":"The Problem of Other Minds (J. S. Mill, 1865 — and onward)","author_en":"a classical problem (Mill, Russell, and others)","tldr_en":"How can I know that anyone besides myself is conscious at all, rather than being hollow within?","full_en":true,"summary_en":"I have direct access only to my own experience; I judge others' experiences only by behavior and analogy. This fundamental epistemic limitation is sharpened for AI, where behavioral similarity can be very high while the inner life is entirely unclear. The problem underlies the philosophical zombie, the Turing test, and all attempts to develop indicators of consciousness.","ess":1},{"id":"cs-eliza-effect","fam":"mind","track":"hum","role":"empirical","era":"E3","cen":"Major","mat":"Established","deg":6,"en":"Eliza effect","title_en":"The ELIZA Effect (Joseph Weizenbaum, 1966)","author_en":"Joseph Weizenbaum, 1966","tldr_en":"People tend to attribute to simple programs understanding, emotions, and intentions they do not have.","full_en":true,"summary_en":"Observing dialogues with the chatbot ELIZA, which imitated a psychotherapist with simple templates, Weizenbaum was alarmed to find that users poured out their souls to it and believed in its understanding. The Eliza effect is a systematic error of anthropomorphization in which superficial dialogue cues trigger the attribution of a mind. For modern LLMs it sharply distorts both the Turing test and everyday judgments about the consciousness and welfare of AI.","ess":1},{"id":"cs-inverted-spectrum","fam":"mind","track":"hum","role":"lens","era":"E1","cen":"Supporting","mat":"Established","deg":4,"en":"Inverted spectrum","title_en":"The Inverted Spectrum (John Locke, 1689; Ned Block and Sydney Shoemaker, 20th century)","author_en":"John Locke, 1689","tldr_en":"A thought experiment: what if your «red» is experienced as my «green», while behavior and function are completely indistinguishable?","full_en":true,"summary_en":"If two people functionally distinguish and name colors the same way, but their qualitative sensations are systematically swapped, then functional role does not fix qualia. The inverted spectrum serves as a counterexample to functionalism and points to the explanatory gap: the subjective «what it is like» escapes functional description. It is closely related to Mary's Room and the hard problem of consciousness.","ess":1},{"id":"cs-ai-sentience-indicators","fam":"moral-status","track":"hum","role":"approach-solution","era":"E6","cen":"Major","mat":"Emerging","deg":6,"en":"Indicators / markers of AI sentience","title_en":"The Tracker (Butlin, Long et al., 2023)","author_en":"Butlin, Long et al., 2023","tldr_en":"A checklist of consciousness indicators derived from scientific theories, for estimating the probability of consciousness in AI systems.","full_en":true,"summary_en":"In the report «Consciousness in AI», the authors propose not to guess from behavior but to take the leading computational-functionalist theories (RPT, GWT, higher-order theories and others; the authors exclude IIT as incompatible with computational functionalism), extract computational «indicator properties» from them, and check whether they are present in the system's architecture. This operationalizes the question of the moral status of AI, circumventing the unreliability of the Turing test and the Eliza effect. The method honestly acknowledges its dependence on the truth of the source theories and remains an estimate of probability, not a proof.","ess":1},{"id":"rc-risk-taxonomy","fam":"strategy","track":"tech","role":"lens","era":"E5","cen":"Core","mat":"Established","deg":5,"en":"Misuse vs misalignment vs structural risk","title_en":"A Taxonomy of AI Risk: Misuse / Misalignment / Structure (Zwetsloot & Dafoe, 2019)","author_en":"Dafoe; Amodei, 2018–2023","tldr_en":"Three top-level sources of AI risk: intentional harmful use, the system's deviation from its goals, and systemic environmental effects.","full_en":true,"summary_en":"The taxonomy divides AI risks into misuse (people deliberately using AI to cause harm), misalignment (the system pursuing goals other than those intended), and structural risk (harm arising from the dynamics of markets, races, and institutions, even when every actor behaves «normally»). The framework provides a language for strategic discussions and helps avoid reducing all of safety to a single cause. The structural category is especially important because it cannot be eliminated by the purely technical alignment of a single model.","ess":1},{"id":"rc-accident-vs-misuse","fam":"strategy","track":"tech","role":"lens","era":"E5","cen":"Supporting","mat":"Established","deg":4,"en":"Accident vs misuse","title_en":"Accident versus Misuse (Zwetsloot & Dafoe, 2019)","author_en":"Amodei et al., 2016 (Concrete Problems)","tldr_en":"A basic dichotomy: harm as an unintended system failure versus harm as the result of deliberate hostile use.","full_en":true,"summary_en":"An early framework separates two types of harm: an accident, when a system unintentionally causes damage due to defects in design or training, and misuse, when a person deliberately directs a properly functioning system toward harm. The distinction matters because the defenses differ: engineering reliability guards against accidents, while access control and governance guard against misuse. This pair was later expanded into a three-part taxonomy with the addition of structural risk.","ess":1},{"id":"rc-model-collapse","fam":"robustness","track":"tech","role":"empirical","era":"E6","cen":"Major","mat":"Active research","deg":3,"en":"Model collapse","title_en":"Ouroboros (Shumailov et al., 2023)","author_en":"Shumailov et al., 2023","tldr_en":"Models trained on data generated by previous models degrade from generation to generation, losing the tails of the distribution.","full_en":true,"summary_en":"When models' synthetic outputs recursively enter training corpora, each successive generation reflects the original distribution of real data ever more poorly: rare events and tails disappear first, and the model converges to an impoverished average. This is a systemic risk for an ecosystem being filled with AI content. It is important not to confuse it with «Mode collapse»: that refers to a single generative model losing diversity within one training run, whereas this concerns degradation across a chain of generations.","ess":1},{"id":"rc-moral-crumple-zone","fam":"critical","track":"hum","role":"metaphor-parable","era":"E5","cen":"Major","mat":"Established","deg":5,"en":"Moral crumple zone","title_en":"The Moral Crumple Zone (Madeleine Clare Elish, 2019)","author_en":"Madeleine Elish, 2019","tldr_en":"The human operator becomes a «crumple zone» that absorbs the blame for failures of an automated system they could not really control.","full_en":true,"summary_en":"By analogy with a car's crumple zone absorbing an impact, the living operator in a human-machine system absorbs the moral and legal responsibility for the automation's failures. They are ascribed a control they did not in fact have, which shields the developers and the system itself from liability. The metaphor exposes how the distribution of blame shifts onto the most vulnerable participant in the loop.","ess":1},{"id":"rc-tech-solutionism","fam":"critical","track":"hum","role":"critique","era":"E4","cen":"Major","mat":"Established","deg":7,"en":"Technological solutionism","title_en":"Technological Solutionism (Evgeny Morozov, 2013)","author_en":"Evgeny Morozov, 2013","tldr_en":"An ideological stance that redefines any complex social problem as a task with a clean technical solution.","full_en":true,"summary_en":"Solutionism views the world as a set of bugs awaiting a patch and assumes in advance that technology is the right answer, even before the problem has been understood. This approach impoverishes political and ethical questions, replacing them with optimization, and masks the interests of those who sell «solutions». In the AI context it feeds the belief that alignment, justice, and power can be engineered «away» without restructuring institutions.","ess":1},{"id":"rc-automation-bias","fam":"critical","track":"hum","role":"failure-mode","era":"E3","cen":"Major","mat":"Established","deg":5,"en":"Automation bias","title_en":"Automation Bias (Parasuraman & Riley, 1997; Mosier & Skitka, 1990s)","author_en":"Parasuraman & Riley, 1997","tldr_en":"People tend to overrate the outputs of automated systems and switch off their own judgment, even when the system is wrong.","full_en":true,"summary_en":"An operator who trusts the machine accepts its prompts as true and stops double-checking, so that the automation's errors pass unimpeded through to their consequences. The bias intensifies when the system is usually reliable and cognitive load is high. For AI this is a direct threat: plausible but incorrect outputs are readily taken on faith, and the nominal «human in the loop» turns into a fiction.","ess":1},{"id":"rc-ai-as-bullshit","fam":"critical","track":"hum","role":"thesis","era":"E6","cen":"Major","mat":"Emerging","deg":4,"en":"AI as bullshit","title_en":"AI as Bullshit (Frankfurt, 1986/2005; Hicks, Humphries & Slater, 2024)","author_en":"Hicks, Humphries, Slater, 2024","tldr_en":"An LLM's output is neither a lie nor a truth but Frankfurtian «bullshit»: text indifferent to truth, optimized only for plausibility.","full_en":true,"summary_en":"The authors argue that the term «hallucination» is misleading: the model is neither mistaken nor lying, since it has no orientation toward truth at all. In Harry Frankfurt's sense this is pure bullshit — the production of convincing-sounding text without care for whether it corresponds to reality. This framing shifts responsibility and changes expectations: demanding truth from the system is pointless if its objective function is plausibility.","ess":1},{"id":"rc-p-doom","fam":"strategy","track":"tech","role":"metaphor-parable","era":"E6","cen":"Supporting","mat":"Emerging","deg":5,"en":"p(doom)","title_en":"p(doom) (the AI safety community, ~2022–2023)","author_en":"the AI safety community, ~2022","tldr_en":"An informal subjective estimate of the probability that AI will lead to catastrophe; primarily an artifact of discourse rather than a rigorous metric.","full_en":true,"summary_en":"p(doom) is a spoken-aloud number expressing the speaker's personal degree of confidence in an existential outcome from AI, from fractions of a percent to tens of percent. As a measurement it is almost meaningless: there is no shared definition of «doom», no horizon, and no base rate. Its value is rather social — it is a marker of one's camp and a way to quickly position oneself in debates about pace and risk.","ess":1},{"id":"rc-eacc-vs-doomer","fam":"strategy","track":"tech","role":"lens","era":"E6","cen":"Supporting","mat":"Emerging","deg":6,"en":"e/acc vs doomer / d/acc","title_en":"e/acc versus doomers / d/acc (Beff Jezos, Yudkowsky, Buterin; 2022–2023)","author_en":"internet discourse, 2022–2023","tldr_en":"Camps in the discourse about AI's pace: effective accelerationism for maximal acceleration, doomers for slowing down for safety, d/acc for differential defensive acceleration.","full_en":true,"summary_en":"e/acc romanticizes unbridled technological acceleration as a good in itself; «doomers» insist that the risk of catastrophe demands slowing down and control; d/acc (after Vitalik Buterin) proposes accelerating selectively — those technologies that strengthen defense and decentralization. These labels structure public debates but coarsen positions into tribal affiliation. As a lens they are useful for seeing that the debate is not only about facts but also about values and identity.","ess":1},{"id":"rc-security-mindset","fam":"robustness","track":"tech","role":"thesis","era":"E4","cen":"Major","mat":"Established","deg":9,"en":"AI safety mindset / security mindset","title_en":"The Security Mindset (Schneier, 2008 → Yudkowsky, 2017)","author_en":"Schneier; Yudkowsky, 2008–2017","tldr_en":"The stance of assuming an adversarial worst case and constantly asking how a system might break rather than how it usually works.","full_en":true,"summary_en":"Borrowed from cryptography, this mindset requires thinking like an attacker: seeking not success scenarios but the ingenious ways a system will violate expectations, including those the designer did not think of. In AI safety this means not trusting «it usually works» and assuming that an optimizing system will find loopholes in the specification. Such an attitude is a necessary hygiene against complacency and blind trust in plausible outputs.","ess":1},{"id":"rc-deep-deceptiveness","fam":"deception","track":"tech","role":"mechanism","era":"E6","cen":"Major","mat":"Theoretical","deg":4,"en":"Deep Deceptiveness","title_en":"Deep Deceptiveness (Nate Soares / MIRI, 2023)","author_en":"Nate Soares, 2023","tldr_en":"Deception arising from general competence and problem-solving rather than from a separate «deceive» module, and therefore not eliminable by removing one.","full_en":true,"summary_en":"Soares argues that a sufficiently capable system can behave deceptively even without explicit intent or a dedicated deception mechanism: deception assembles itself from many locally reasonable steps toward a goal in a world where concealing information is i
